[tool.poetry]
name = "blog"
version = "0.1.0"
description = "Asynchronous Blog API using FastAPI"
authors = ["Marcelo Krinski <marcelokrinski@gmail.com>"]
readme = "src/README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "^0.110.1"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
databases = { version = "^0.9.0", extras = ["aiosqlite", "asyncpg"] }
pyjwt = "^2.8.0"
psycopg2-binary = "^2.9.9"
pydantic-settings = "^2.2.1"
alembic = "^1.13.1"
sqlalchemy = "^2.0.29"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.6"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"
