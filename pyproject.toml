[tool.poetry]
name = "blog"
version = "0.1.0"
description = ""
authors = ["Marcelo Krinski <marcelokrinski@gmail.com>"]
readme = "README.md"

packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = "*"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
databases = {version = "*", extras = ["aiosqlite", "asyncpg"]}
pyjwt = "*"
psycopg2-binary = "*"
pydantic-settings = "*"
alembic = "*"


[tool.poetry.group.dev.dependencies]
pytest-asyncio = "*"
pytest = "*"
httpx = "*"
pytest-mock = "*"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"