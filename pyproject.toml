[tool.poetry]
name = "blog"
version = "0.1.0"
description = "FastAPI async blog API"
authors = ["mlkrinski <marcelokrinski@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = "^0.121.0"
uvicorn = {extras = ["standard"], version = "^0.38.0"}
databases = {extras = ["aiosqlite"], version = "^0.9.0"}
pyjwt = "^2.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
httpx = "^0.28.1"
pytest-mock = "^3.15.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# 👇 ESSENCIAL para o Render
package-mode = false
